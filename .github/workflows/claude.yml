name: Claude Code

# Disabled by default in the Acellere fork.
# Re-enable only after explicitly configuring the Claude integration,
# repository permissions, secrets, and trusted trigger policy.
on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Claude integration disabled
        run: |
          echo "Claude Code automation is intentionally disabled in the Acellere fork."
          echo "Configure credentials and a trusted trigger policy before enabling it."
