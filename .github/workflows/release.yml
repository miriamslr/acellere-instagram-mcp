name: Release & Publish

# Disabled by default in the Acellere fork.
# Publishing must be an explicit, manual action after package identity,
# registry target, versioning, and release credentials are reviewed.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release disabled in Acellere fork
        run: |
          echo "Release publishing is intentionally disabled in the Acellere fork."
          echo "Review package identity, registry targets, versioning, and credentials before re-enabling publication."
