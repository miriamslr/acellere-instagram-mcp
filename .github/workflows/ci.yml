name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  dependency-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/acellere-safe-bootstrap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh vulnerable transitive dependencies in lockfile
        run: npm audit fix --package-lock-only
      - name: Commit refreshed lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already contains the available audit fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh vulnerable transitive dependencies"
          git push origin HEAD:${{ github.head_ref }}
      - name: Verify high-severity audit findings are resolved
        run: npm audit --audit-level=high

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if setup did not succeed
        if: needs.setup.result != 'success'
        run: |
          echo "::error::setup job did not succeed (result: ${{ needs.setup.result }})"
          exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: tsc --noEmit

  lint:
    needs: setup
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if setup did not succeed
        if: needs.setup.result != 'success'
        run: |
          echo "::error::setup job did not succeed (result: ${{ needs.setup.result }})"
          exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run lint

  test:
    needs: setup
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if setup did not succeed
        if: needs.setup.result != 'success'
        run: |
          echo "::error::setup job did not succeed (result: ${{ needs.setup.result }})"
          exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm test

  audit:
    needs: setup
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if setup did not succeed
        if: needs.setup.result != 'success'
        run: |
          echo "::error::setup job did not succeed (result: ${{ needs.setup.result }})"
          exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/version-sync
        with:
          node-version: ${{ env.NODE_VERSION }}

  build:
    needs: [setup, typecheck, lint, test, audit, version-sync]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        if: |
          needs.setup.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.test.result != 'success' ||
          needs.audit.result != 'success' ||
          needs['version-sync'].result != 'success'
        run: |
          echo "::error::An upstream job did not succeed"
          echo "setup=${{ needs.setup.result }} typecheck=${{ needs.typecheck.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }} audit=${{ needs.audit.result }} version-sync=${{ needs['version-sync'].result }}"
          exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run build
