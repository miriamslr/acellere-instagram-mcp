name: One-time Instagram API mode patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch-api-mode:
    if: github.head_ref == 'feat/instagram-api-mode' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Patch Instagram API mode support
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Config: explicit API/login mode, preserving upstream behavior by default.
          replace(
              'src/config.ts',
              'import { z } from "zod";\n',
              'import { z } from "zod";\n\nexport const InstagramApiModeSchema = z.enum(["instagram-login", "facebook-login"]).default("instagram-login");\n'
          )
          replace(
              'src/config.ts',
              '  instagramAccessToken: z.string().default(""),\n  instagramUserId: userIdSchema("INSTAGRAM_USER_ID"),\n',
              '  instagramAccessToken: z.string().default(""),\n  instagramUserId: userIdSchema("INSTAGRAM_USER_ID"),\n  instagramApiMode: InstagramApiModeSchema,\n'
          )
          replace(
              'src/config.ts',
              '    instagramAccessToken: process.env.INSTAGRAM_ACCESS_TOKEN,\n    instagramUserId: process.env.INSTAGRAM_USER_ID,\n',
              '    instagramAccessToken: process.env.INSTAGRAM_ACCESS_TOKEN,\n    instagramUserId: process.env.INSTAGRAM_USER_ID,\n    instagramApiMode: process.env.INSTAGRAM_API_MODE,\n'
          )
          replace(
              'src/config.ts',
              '  const noCredentials = Object.values(config).every((v) => !v);\n',
              '  const noCredentials = [\n    config.appId,\n    config.appSecret,\n    config.instagramAccessToken,\n    config.instagramUserId,\n    config.threadsAccessToken,\n    config.threadsUserId,\n  ].every((v) => !v);\n'
          )

          # Client: route Instagram calls to the host required by the selected login flow.
          replace(
              'src/services/meta-client.ts',
              '    this.igBase = `https://graph.instagram.com/${metaVersion}`;\n    this.fbBase = `https://graph.facebook.com/${metaVersion}`;\n',
              '    this.fbBase = `https://graph.facebook.com/${metaVersion}`;\n    this.igBase =\n      config.instagramApiMode === "facebook-login"\n        ? this.fbBase\n        : `https://graph.instagram.com/${metaVersion}`;\n'
          )
          replace(
              'src/services/meta-client.ts',
              '  async igExchangeToken(shortToken: string): Promise<ClientResponse> {\n    if (!this.config.appSecret) {\n',
              '  async igExchangeToken(shortToken: string): Promise<ClientResponse> {\n    if (this.config.instagramApiMode === "facebook-login") {\n      throw new Error(\n        "Instagram token exchange via graph.instagram.com is only available in INSTAGRAM_API_MODE=instagram-login. Use the Facebook Login long-lived user/page token flow instead."\n      );\n    }\n    if (!this.config.appSecret) {\n'
          )
          replace(
              'src/services/meta-client.ts',
              '  async igRefreshToken(longToken: string): Promise<ClientResponse> {\n    return this.request(IG_TOKEN_BASE, longToken, "GET", "/refresh_access_token", {\n',
              '  async igRefreshToken(longToken: string): Promise<ClientResponse> {\n    if (this.config.instagramApiMode === "facebook-login") {\n      throw new Error(\n        "Instagram token refresh via graph.instagram.com is only available in INSTAGRAM_API_MODE=instagram-login. Refresh the Facebook Login token through the Facebook token flow instead."\n      );\n    }\n    return this.request(IG_TOKEN_BASE, longToken, "GET", "/refresh_access_token", {\n'
          )

          # Example configuration for this fork: broad Facebook Login coverage, read-only safety.
          replace(
              '.env.example',
              'INSTAGRAM_ACCESS_TOKEN=your_instagram_access_token\nINSTAGRAM_USER_ID=your_instagram_user_id\n',
              'INSTAGRAM_ACCESS_TOKEN=your_instagram_access_token\nINSTAGRAM_USER_ID=your_instagram_user_id\n# Acellere uses Facebook Login for broader Instagram Graph API coverage.\n# Use instagram-login only when intentionally using Business Login for Instagram.\nINSTAGRAM_API_MODE=facebook-login\n'
          )

          # README environment contract.
          replace(
              'README.md',
              '| `INSTAGRAM_USER_ID` | For Instagram | Instagram Business/Creator account ID (numeric string, or `"me"` for the authenticated user) |\n',
              '| `INSTAGRAM_USER_ID` | For Instagram | Instagram Business/Creator account ID (numeric string, or `"me"` for the authenticated user) |\n| `INSTAGRAM_API_MODE` | Optional | `instagram-login` (default, host `graph.instagram.com`) or `facebook-login` (host `graph.facebook.com`). Acellere uses `facebook-login` for broader Facebook-linked Instagram capabilities |\n'
          )

          # Acellere setup guide: exact mode/token semantics for the selected flow.
          replace(
              'docs/ACELLERE_SETUP.md',
              'INSTAGRAM_ACCESS_TOKEN=...\nINSTAGRAM_USER_ID=...\nACELLERE_WRITE_MODE=read-only\n',
              'INSTAGRAM_ACCESS_TOKEN=...\nINSTAGRAM_USER_ID=...\nINSTAGRAM_API_MODE=facebook-login\nACELLERE_WRITE_MODE=read-only\n'
          )
          replace(
              'docs/ACELLERE_SETUP.md',
              'Não adicionar credenciais reais ao GitHub. Usar secrets/variáveis do ambiente onde o MCP for executado.\n',
              'Não adicionar credenciais reais ao GitHub. Usar secrets/variáveis do ambiente onde o MCP for executado.\n\n### Modo de API usado pela Acellere\n\nPara a cobertura mais ampla deste fork, usar `INSTAGRAM_API_MODE=facebook-login`. Nesse modo, as chamadas de Instagram usam `graph.facebook.com`, como exigido pelo fluxo Facebook Login, e `INSTAGRAM_ACCESS_TOKEN` deve receber o Page Access Token da Página vinculada ao Instagram profissional. O `INSTAGRAM_USER_ID` é o ID retornado em `instagram_business_account.id`.\n\nO modo `instagram-login` continua disponível e é o padrão de compatibilidade com o upstream; nele o host é `graph.instagram.com`. As rotinas `meta_exchange_token`/`meta_refresh_token` para `platform=instagram` são específicas desse modo e ficam bloqueadas no modo `facebook-login`.\n'
          )

          # Focused regression tests for host routing and token-flow guard.
          Path('src/services/instagram-api-mode.test.ts').write_text(r'''import { afterEach, describe, expect, it, vi } from "vitest";
import type { MetaConfig } from "../config.js";
import { MetaClient } from "./meta-client.js";

function config(mode: "instagram-login" | "facebook-login"): MetaConfig {
  return {
    appId: "",
    appSecret: "",
    instagramAccessToken: "test-token",
    instagramUserId: "123456",
    instagramApiMode: mode,
    threadsAccessToken: "",
    threadsUserId: "",
  };
}

function mockSuccessfulFetch(): ReturnType<typeof vi.fn> {
  const fn = vi.fn(async () =>
    new Response(JSON.stringify({ id: "123456" }), {
      status: 200,
      headers: { "content-type": "application/json" },
    })
  );
  vi.stubGlobal("fetch", fn);
  return fn;
}

afterEach(() => {
  vi.unstubAllGlobals();
});

describe("Instagram API mode routing", () => {
  it("uses graph.instagram.com for instagram-login", async () => {
    const fetchMock = mockSuccessfulFetch();
    const client = new MetaClient(config("instagram-login"), { maxRetries: 0 });

    await client.ig("GET", "/123456");

    expect(String(fetchMock.mock.calls[0]?.[0])).toMatch(
      /^https:\/\/graph\.instagram\.com\/v25\.0\/123456\?/
    );
  });

  it("uses graph.facebook.com for facebook-login", async () => {
    const fetchMock = mockSuccessfulFetch();
    const client = new MetaClient(config("facebook-login"), { maxRetries: 0 });

    await client.ig("GET", "/123456");

    expect(String(fetchMock.mock.calls[0]?.[0])).toMatch(
      /^https:\/\/graph\.facebook\.com\/v25\.0\/123456\?/
    );
  });

  it("blocks Instagram-Login token exchange helpers in facebook-login mode", async () => {
    const client = new MetaClient(config("facebook-login"), { maxRetries: 0 });

    await expect(client.igExchangeToken("short-token")).rejects.toThrow(
      /only available in INSTAGRAM_API_MODE=instagram-login/
    );
    await expect(client.igRefreshToken("long-token")).rejects.toThrow(
      /only available in INSTAGRAM_API_MODE=instagram-login/
    );
  });
});
''')
          PY
      - name: Validate patch
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test -- --run
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.ts src/services/meta-client.ts src/services/instagram-api-mode.test.ts .env.example README.md docs/ACELLERE_SETUP.md
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git commit -m "feat: support Instagram Facebook Login API mode"
          git push origin HEAD:${{ github.head_ref }}
